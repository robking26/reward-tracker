<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reward Tracker">
<title>Reward Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    overflow: hidden;
  }

  .stage {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    position: relative;
    overflow: hidden;
  }

  .orb {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184, 115, 51, 0.3), transparent 60%);
    pointer-events: none;
    animation: pulse 4s ease-in-out infinite;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    animation: rise 1s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .wave {
    font-size: 72px;
    margin-bottom: 24px;
    display: inline-block;
    animation: wave 2.5s ease-in-out infinite;
    transform-origin: 70% 70%;
  }

  h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
    color: #f5f5f5;
  }

  .accent {
    color: #c8843d;
  }

  p {
    font-size: 16px;
    color: #888;
    line-height: 1.5;
    max-width: 320px;
    margin: 0 auto 32px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(184, 115, 51, 0.14);
    border: 1px solid rgba(184, 115, 51, 0.3);
    color: #c8843d;
    padding: 10px 18px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .pill .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #c8843d;
    box-shadow: 0 0 12px #c8843d;
    animation: pulse-dot 1.5s ease-in-out infinite;
  }

  .footer {
    position: absolute;
    bottom: max(24px, env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: #444;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    z-index: 1;
  }

  @keyframes wave {
    0%, 60%, 100% { transform: rotate(0deg); }
    10%, 30% { transform: rotate(14deg); }
    20% { transform: rotate(-8deg); }
    40% { transform: rotate(-4deg); }
    50% { transform: rotate(10deg); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="orb"></div>
    <div class="content">
      <span class="wave">👋</span>
      <h1>Hello, <span class="accent">Rob</span></h1>
      <p>This is your reward tracker, live on the internet. The real app is coming. For now, this is enough.</p>
      <div class="pill">
        <span class="dot"></span>
        Phase 1 complete
      </div>
    </div>
    <div class="footer">Reward Tracker · v0.1</div>
  </div>
</body>
</html>
