<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reward Tracker">
<title>Reward Tracker</title>
<script>
  // 👇 PASTE YOUR GOOGLE APPS SCRIPT URL BELOW (the one ending in /exec)
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWFaZRctlYwlQUknF5WTDsDvJfEF64G-C9fCfu6m-NtnwhuHVYIRtUne6i6Vib3y-z/exec";
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #161616;
    --surface-2: #1f1f1f;
    --surface-3: #2a2a2a;
    --border: #2a2a2a;
    --text: #f5f5f5;
    --text-dim: #888;
    --text-faint: #555;
    --ring-track: #2a2a2a;
    --accent: #b87333;
    --accent-bright: #c8843d;
    --accent-soft: rgba(184, 115, 51, 0.14);
    --accent-tint: rgba(184, 115, 51, 0.06);
    --accent-border: rgba(184, 115, 51, 0.25);
    --ring-fill: #c8843d;
    --ring-fill-glow: rgba(200, 132, 61, 0.4);
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
  }

  body {
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }

  /* TOP HEADER */
  .top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0 20px;
  }
  .header-greeting {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 2px;
  }
  .header-day {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .refresh-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-family: inherit;
    transition: all 0.2s;
  }
  .refresh-btn:active {
    transform: scale(0.92);
    background: var(--surface-2);
  }
  .refresh-btn.spinning { animation: spin 0.8s linear infinite; }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* STATUS BADGE */
  .status-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    padding: 0 2px;
  }
  .status-badge-strip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-soft);
    padding: 6px 12px;
    border-radius: 100px;
    font-size: 10px;
    color: var(--accent-bright);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 700;
  }
  .status-badge-strip::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-bright);
  }
  .status-strip-meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-left: auto;
  }

  /* LOADING / ERROR */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 0;
    color: var(--text-faint);
    font-size: 14px;
  }
  .loading::after {
    content: '...';
    animation: dots 1.5s steps(4) infinite;
    width: 24px;
    display: inline-block;
    text-align: left;
  }
  @keyframes dots {
    0%, 25% { content: ''; }
    50% { content: '.'; }
    75% { content: '..'; }
    100% { content: '...'; }
  }
  .error-card {
    background: rgba(232, 116, 109, 0.1);
    border: 1px solid rgba(232, 116, 109, 0.3);
    border-radius: 16px;
    padding: 20px;
    color: #e8746d;
    font-size: 14px;
    line-height: 1.5;
  }
  .error-card strong {
    display: block;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .error-card code {
    display: block;
    margin-top: 8px;
    padding: 8px;
    background: rgba(0,0,0,0.3);
    border-radius: 6px;
    font-size: 12px;
    color: var(--text);
    word-break: break-all;
  }

  /* WEEK CARD */
  .week-card {
    background: var(--surface);
    border-radius: 22px;
    padding: 22px 18px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .week-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .week-card-title {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
  }
  .week-card-link {
    font-size: 11px;
    color: var(--accent-bright);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.5;
  }

  /* HERO RING */
  .week-ring-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 22px;
  }
  .week-ring {
    width: 200px;
    height: 200px;
    position: relative;
  }
  .week-ring svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .week-ring .ring-track {
    fill: none;
    stroke: var(--ring-track);
    stroke-width: 13;
  }
  .week-ring .ring-fill {
    fill: none;
    stroke: var(--ring-fill);
    stroke-width: 13;
    stroke-linecap: round;
    filter: drop-shadow(0 0 12px var(--ring-fill-glow));
    transition: stroke-dashoffset 1s cubic-bezier(0.34, 1.2, 0.64, 1);
  }
  .week-ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .week-ring-label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 4px;
  }
  .week-ring-number {
    font-size: 58px;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--text);
  }
  .week-ring-target {
    font-size: 16px;
    color: var(--text-faint);
    margin-top: 2px;
    font-weight: 500;
  }

  /* DAYS ROW */
  .days-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0;
    margin-bottom: 12px;
  }
  .day-mini {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }
  .day-mini-ring {
    width: 30px;
    height: 30px;
    position: relative;
  }
  .day-mini-ring svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .day-mini-ring .ring-track {
    fill: none;
    stroke: var(--ring-track);
    stroke-width: 2.5;
  }
  .day-mini-ring .ring-fill {
    fill: none;
    stroke: var(--ring-fill);
    stroke-width: 2.5;
    stroke-linecap: round;
  }
  .day-mini-ring.future .ring-track {
    stroke: var(--ring-track);
    stroke-dasharray: 2 3;
  }
  .day-mini-num {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--ring-fill);
  }
  .day-mini-num.zero { color: var(--text-faint); font-weight: 500; }
  .day-mini-num.future { color: transparent; }
  .day-mini-letter {
    font-size: 9px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .day-mini.today .day-mini-letter {
    color: var(--accent-bright);
    font-weight: 700;
  }
  .day-mini.today .day-mini-ring {
    outline: 1.5px solid var(--text);
    outline-offset: 2px;
    border-radius: 50%;
  }

  /* WEEK FOOTER */
  .week-footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .week-footer strong { color: var(--text); font-weight: 600; }

  /* SECONDARY CARDS */
  .secondary-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .small-card {
    background: var(--surface);
    border-radius: 14px;
    padding: 12px;
    border: 1px solid var(--border);
  }
  .small-card-label {
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 5px;
  }
  .small-card-value {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
    color: var(--text);
  }
  .small-card-meta {
    font-size: 10px;
    color: var(--text-faint);
  }
  .cluster-dots {
    display: flex;
    gap: 5px;
    margin-top: 4px;
  }
  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--surface-3);
    border: 1px solid var(--border);
  }
  .dot.filled {
    background: var(--accent-bright);
    border-color: var(--accent-bright);
  }

  /* REWARD STRIP */
  .reward-strip {
    background: linear-gradient(135deg, var(--accent-soft), var(--accent-tint));
    border: 1px solid var(--accent-border);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .reward-strip-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent-bright);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    font-weight: 700;
  }
  .reward-strip-text { flex: 1; }
  .reward-strip-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .reward-strip-detail {
    font-size: 11px;
    color: var(--text-dim);
  }
  .reward-strip-arrow {
    color: var(--accent-bright);
    font-size: 16px;
  }

  /* ACTIVITY */
  .activity-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .activity-card-title {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .activity-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .activity-row:last-child { border-bottom: none; }
  .activity-label { color: var(--text); }
  .activity-meta { color: var(--text-dim); font-size: 11px; }
  .activity-value {
    color: var(--accent-bright);
    font-weight: 600;
  }
  .activity-empty {
    text-align: center;
    color: var(--text-faint);
    font-size: 12px;
    padding: 8px 0;
  }

  /* SYNC */
  .sync-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 10px;
    color: var(--text-faint);
    margin: 14px 0 6px;
  }
  .sync-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #6dbe7b;
  }
  .sync-dot.error { background: #e8746d; }

  .v-tag {
    text-align: center;
    color: #333;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 16px;
  }
</style>
</head>
<body>

<div class="top-header">
  <div>
    <div class="header-greeting" id="greeting">Hello, Rob</div>
    <div class="header-day" id="dayname">Today</div>
  </div>
  <button class="refresh-btn" id="refreshBtn" onclick="loadData()">↻</button>
</div>

<div class="status-strip">
  <div class="status-badge-strip">Bronze · 2026</div>
  <div class="status-strip-meta" id="statusMeta">16 weeks to Silver</div>
</div>

<div id="content">
  <div class="loading">Fetching your data</div>
</div>

<div class="sync-footer" id="syncFooter">
  <span class="sync-dot" id="syncDot"></span>
  <span id="syncText">Waiting</span>
</div>

<div class="v-tag">Reward Tracker · v0.3</div>

<script>
  // ===== GREETING =====
  function setGreeting() {
    const hour = new Date().getHours();
    let greeting;
    if (hour < 5) greeting = "Late night, Rob";
    else if (hour < 12) greeting = "Good morning, Rob";
    else if (hour < 17) greeting = "Good afternoon, Rob";
    else if (hour < 21) greeting = "Good evening, Rob";
    else greeting = "Evening, Rob";
    document.getElementById('greeting').textContent = greeting;

    const today = new Date();
    document.getElementById('dayname').textContent = today.toLocaleDateString('en-GB', { weekday: 'long' });
  }
  setGreeting();

  // ===== SCORING =====
  function stepsToPoints(stepCount) {
    if (stepCount >= 12500) return 8;
    if (stepCount >= 10000) return 5;
    if (stepCount >= 5000) return 3;
    return 0;
  }

  function visitPoints(visits, dateStr) {
    const onDate = visits.filter(v => v.date === dateStr && v.event === 'entry');
    return onDate.length > 0 ? 5 : 0;
  }

  function swimPoints(swimsByDate, dateStr) {
    const distance = swimsByDate[dateStr] || 0;
    return distance > 0 ? 5 : 0;
  }

  function dailyTotal(stepCount, gymVisits, swimsByDate, dateStr) {
    const raw = stepsToPoints(stepCount)
              + visitPoints(gymVisits, dateStr)
              + swimPoints(swimsByDate, dateStr);
    return Math.min(raw, 8);
  }

  // ===== DATES =====
  function getWeekDays() {
    const today = new Date();
    today.setHours(0,0,0,0);
    const todayDow = (today.getDay() + 6) % 7;
    const monday = new Date(today);
    monday.setDate(today.getDate() - todayDow);
    const letters = ['M','T','W','T','F','S','S'];
    const fullNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      days.push({
        key,
        date: d,
        letter: letters[i],
        fullName: fullNames[i],
        isFuture: d > today,
        isToday: d.getTime() === today.getTime()
      });
    }
    return days;
  }

  function shiftDateBackOne(dateStr) {
    if (!dateStr) return null;
    const [y, m, d] = dateStr.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    date.setDate(date.getDate() - 1);
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  }

  function formatActivityDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    const today = new Date();
    today.setHours(0,0,0,0);
    const diff = Math.round((today - date) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return date.toLocaleDateString('en-GB', { weekday: 'long' });
  }

  // ===== RINGS =====
  function ringSvg(score, size, strokeWidth, max = 8) {
    const r = (size - strokeWidth) / 2;
    const cx = size / 2;
    const cy = size / 2;
    const circumference = 2 * Math.PI * r;
    const fillRatio = Math.min(score / max, 1);
    const dashOffset = circumference * (1 - fillRatio);
    return `
      <svg viewBox="0 0 ${size} ${size}">
        <circle class="ring-track" cx="${cx}" cy="${cy}" r="${r}"></circle>
        <circle class="ring-fill" cx="${cx}" cy="${cy}" r="${r}"
                stroke-dasharray="${circumference}"
                stroke-dashoffset="${dashOffset}"></circle>
      </svg>
    `;
  }

  // ===== LOAD =====
  async function loadData() {
    if (APPS_SCRIPT_URL === "PASTE_YOUR_URL_HERE") {
      showError(
        "Setup incomplete",
        "The Apps Script URL hasn't been pasted in yet. Open index.html in a text editor, find APPS_SCRIPT_URL near the top, and replace the placeholder.",
        null
      );
      return;
    }

    const refreshBtn = document.getElementById('refreshBtn');
    refreshBtn.classList.add('spinning');

    try {
      const response = await fetch(APPS_SCRIPT_URL);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      render(data);
      updateSync('healthy', 'Last sync just now');
    } catch (err) {
      showError(
        "Couldn't reach your data",
        "Either the URL is wrong, the deployment access isn't 'Anyone', or you're offline.",
        err.message
      );
      updateSync('error', 'Sync failed');
    } finally {
      setTimeout(() => refreshBtn.classList.remove('spinning'), 400);
    }
  }

  function showError(title, message, detail) {
    document.getElementById('content').innerHTML = `
      <div class="error-card">
        <strong>${title}</strong>
        ${message}
        ${detail ? `<code>${detail}</code>` : ''}
      </div>
    `;
  }

  function updateSync(state, text) {
    const dot = document.getElementById('syncDot');
    dot.className = 'sync-dot' + (state === 'healthy' ? '' : ' ' + state);
    document.getElementById('syncText').textContent = text;
  }

  // ===== RENDER =====
  function render(data) {
    const weekDays = getWeekDays();

    // Shift step dates back one day (logged the morning after)
    const stepsByDate = {};
    (data.steps || []).forEach(s => {
      const actualDate = shiftDateBackOne(s.date);
      if (actualDate) stepsByDate[actualDate] = s.count;
    });

    // Shift swim dates back one day
    const swimsByDate = {};
    (data.swims || []).forEach(s => {
      const actualDate = shiftDateBackOne(s.date);
      if (actualDate) swimsByDate[actualDate] = s.distance;
    });

    // Gym visits — no shift, logged real-time
    const gymVisits = data.gymVisits || [];

    const dayResults = weekDays.map(day => {
      if (day.isFuture) return { ...day, steps: null, points: null };
      const steps = stepsByDate[day.key] || 0;
      const points = dailyTotal(steps, gymVisits, swimsByDate, day.key);
      return { ...day, steps, points };
    });

    const weekTotal = dayResults.reduce((sum, d) => sum + (d.points || 0), 0);

    // Last activity
    let lastActivity = 'no activity yet';
    for (let i = dayResults.length - 1; i >= 0; i--) {
      const d = dayResults[i];
      if (d.points && d.points > 0) {
        if (d.isToday) lastActivity = 'today';
        else {
          const diff = Math.round((new Date(weekDays[6].date) - d.date) / 86400000);
          if (diff === 0) lastActivity = 'today';
          else lastActivity = formatActivityDate(d.key).toLowerCase();
        }
        break;
      }
    }

    // Activity for this week
    const weekStart = weekDays[0].key;
    const weekEnd = weekDays[6].key;
    const recentVisits = gymVisits.filter(v =>
      v.date >= weekStart && v.date <= weekEnd && v.event === 'entry'
    );
    const recentSwims = Object.entries(swimsByDate)
      .filter(([date, distance]) => date >= weekStart && date <= weekEnd && distance > 0)
      .map(([date, distance]) => ({ date, distance }));

    // Reward strip
    let rewardStrip = '';
    if (weekTotal >= 50) {
      rewardStrip = `
        <div class="reward-strip">
          <div class="reward-strip-icon">★</div>
          <div class="reward-strip-text">
            <div class="reward-strip-title">Tier 2 unlocked</div>
            <div class="reward-strip-detail">Pick your reward before next Sunday</div>
          </div>
          <div class="reward-strip-arrow">›</div>
        </div>
      `;
    } else if (weekTotal >= 40) {
      rewardStrip = `
        <div class="reward-strip">
          <div class="reward-strip-icon">★</div>
          <div class="reward-strip-text">
            <div class="reward-strip-title">Tier 1 unlocked</div>
            <div class="reward-strip-detail">Pick now, or push for Tier 2</div>
          </div>
          <div class="reward-strip-arrow">›</div>
        </div>
      `;
    }

    document.getElementById('content').innerHTML = `
      <div class="week-card">
        <div class="week-card-header">
          <div class="week-card-title">Points this week</div>
          <div class="week-card-link">View statement ›</div>
        </div>

        <div class="week-ring-wrap">
          <div class="week-ring">
            ${ringSvg(weekTotal, 200, 13, 50)}
            <div class="week-ring-center">
              <div class="week-ring-label">This week</div>
              <div class="week-ring-number">${weekTotal}</div>
              <div class="week-ring-target">/ 50</div>
            </div>
          </div>
        </div>

        <div class="days-row">
          ${dayResults.map(d => renderDayMini(d)).join('')}
        </div>

        <div class="week-footer">
          Last points earned <strong>${lastActivity}</strong>
        </div>
      </div>

      <div class="secondary-row">
        <div class="small-card">
          <div class="small-card-label">Cluster</div>
          <div class="small-card-value">0 / 4</div>
          <div class="cluster-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>
        <div class="small-card">
          <div class="small-card-label">To Silver</div>
          <div class="small-card-value">16 wks</div>
          <div class="small-card-meta">0 / 16 done</div>
        </div>
      </div>

      ${rewardStrip}

      ${(recentVisits.length > 0 || recentSwims.length > 0) ? `
        <div class="activity-card">
          <div class="activity-card-title">This week's activity</div>
          ${recentVisits.map(v => `
            <div class="activity-row">
              <div>
                <div class="activity-label">Gym visit</div>
                <div class="activity-meta">${formatActivityDate(v.date)}${v.time ? ' · ' + v.time : ''}</div>
              </div>
              <div class="activity-value">+5</div>
            </div>
          `).join('')}
          ${recentSwims.map(s => `
            <div class="activity-row">
              <div>
                <div class="activity-label">Swim</div>
                <div class="activity-meta">${formatActivityDate(s.date)} · ${Math.round(s.distance)}m</div>
              </div>
              <div class="activity-value">+5</div>
            </div>
          `).join('')}
        </div>
      ` : ''}
    `;
  }

  function renderDayMini(d) {
    return `
      <div class="day-mini ${d.isToday ? 'today' : ''}">
        <div class="day-mini-ring ${d.isFuture ? 'future' : ''}">
          ${d.isFuture ? `
            <svg viewBox="0 0 30 30">
              <circle class="ring-track" cx="15" cy="15" r="13.75"></circle>
            </svg>
          ` : ringSvg(d.points, 30, 2.5, 8)}
          <div class="day-mini-num ${d.points === 0 ? 'zero' : ''} ${d.isFuture ? 'future' : ''}">${d.isFuture ? '' : d.points}</div>
        </div>
        <div class="day-mini-letter">${d.letter}</div>
      </div>
    `;
  }

  loadData();
  setInterval(loadData, 5 * 60 * 1000);
</script>

</body>
</html>
