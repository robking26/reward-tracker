<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reward Tracker">
<title>Reward Tracker</title>
<script>
  // 👇 PASTE YOUR GOOGLE APPS SCRIPT URL BELOW (the one ending in /exec)
  const APPS_SCRIPT_URL = "PASTE_YOUR_URL_HERE";
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
  }

  body {
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }

  .top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0 24px;
  }
  .header-greeting {
    font-size: 13px;
    color: #888;
    margin-bottom: 2px;
  }
  .header-day {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .refresh-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #161616;
    border: 1px solid #2a2a2a;
    color: #888;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-family: inherit;
    transition: all 0.2s;
  }
  .refresh-btn:active {
    transform: scale(0.92);
    background: #1f1f1f;
  }
  .refresh-btn.spinning { animation: spin 0.8s linear infinite; }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .status-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    padding: 0 2px;
  }
  .status-badge-strip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(184, 115, 51, 0.14);
    padding: 5px 11px;
    border-radius: 100px;
    font-size: 10px;
    color: #c8843d;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 700;
  }
  .status-badge-strip::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c8843d;
  }

  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 0;
    color: #555;
    font-size: 14px;
  }
  .loading::after {
    content: '...';
    animation: dots 1.5s steps(4) infinite;
    width: 24px;
    display: inline-block;
    text-align: left;
  }
  @keyframes dots {
    0%, 25% { content: ''; }
    50% { content: '.'; }
    75% { content: '..'; }
    100% { content: '...'; }
  }

  .error-card {
    background: rgba(232, 116, 109, 0.1);
    border: 1px solid rgba(232, 116, 109, 0.3);
    border-radius: 16px;
    padding: 20px;
    color: #e8746d;
    font-size: 14px;
    line-height: 1.5;
  }
  .error-card strong {
    display: block;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .error-card code {
    display: block;
    margin-top: 8px;
    padding: 8px;
    background: rgba(0,0,0,0.3);
    border-radius: 6px;
    font-size: 12px;
    color: #f5f5f5;
    word-break: break-all;
  }

  .week-card {
    background: #161616;
    border: 1px solid #2a2a2a;
    border-radius: 20px;
    padding: 22px 20px;
    margin-bottom: 16px;
  }
  .week-card-title {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .week-total {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 4px;
  }
  .week-total-num {
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    color: #c8843d;
  }
  .week-total-label {
    font-size: 14px;
    color: #555;
  }
  .week-meta {
    font-size: 12px;
    color: #888;
    margin-bottom: 18px;
  }

  .days-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: #2a2a2a;
    border-radius: 14px;
    overflow: hidden;
  }
  .day-row {
    background: #161616;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .day-row.today {
    background: rgba(184, 115, 51, 0.06);
  }
  .day-name {
    font-size: 14px;
    font-weight: 500;
  }
  .day-row.today .day-name {
    color: #c8843d;
    font-weight: 700;
  }
  .day-name .day-date {
    font-size: 11px;
    color: #555;
    margin-left: 6px;
    font-weight: 400;
  }
  .day-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .day-steps {
    font-size: 14px;
    color: #888;
    font-variant-numeric: tabular-nums;
  }
  .day-points {
    background: rgba(184, 115, 51, 0.15);
    color: #c8843d;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    min-width: 36px;
    text-align: center;
  }
  .day-points.zero {
    background: #1f1f1f;
    color: #555;
  }

  .activity-card {
    background: #161616;
    border: 1px solid #2a2a2a;
    border-radius: 20px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .activity-card-title {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .activity-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #2a2a2a;
    font-size: 14px;
  }
  .activity-row:last-child { border-bottom: none; }
  .activity-label { color: #f5f5f5; }
  .activity-meta { color: #888; font-size: 12px; }
  .activity-value { color: #c8843d; font-weight: 600; }
  .activity-empty {
    text-align: center;
    color: #555;
    font-size: 13px;
    padding: 12px 0;
  }

  .sync-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 11px;
    color: #555;
    margin: 16px 0 8px;
  }
  .sync-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #6dbe7b;
  }
  .sync-dot.error { background: #e8746d; }

  .v-tag {
    text-align: center;
    color: #333;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 24px;
  }
</style>
</head>
<body>

<div class="top-header">
  <div>
    <div class="header-greeting" id="greeting">Hello, Rob</div>
    <div class="header-day" id="dayname">Today</div>
  </div>
  <button class="refresh-btn" id="refreshBtn" onclick="loadData()">↻</button>
</div>

<div class="status-strip">
  <div class="status-badge-strip">Bronze · 2026</div>
</div>

<div id="content">
  <div class="loading">Fetching your data</div>
</div>

<div class="sync-footer" id="syncFooter">
  <span class="sync-dot" id="syncDot"></span>
  <span id="syncText">Waiting</span>
</div>

<div class="v-tag">Reward Tracker · v0.2.1</div>

<script>
  function setGreeting() {
    const hour = new Date().getHours();
    let greeting;
    if (hour < 5) greeting = "Late night, Rob";
    else if (hour < 12) greeting = "Good morning, Rob";
    else if (hour < 17) greeting = "Good afternoon, Rob";
    else if (hour < 21) greeting = "Good evening, Rob";
    else greeting = "Evening, Rob";
    document.getElementById('greeting').textContent = greeting;

    const today = new Date();
    document.getElementById('dayname').textContent = today.toLocaleDateString('en-GB', { weekday: 'long' });
  }
  setGreeting();

  function stepsToPoints(stepCount) {
    if (stepCount >= 12500) return 8;
    if (stepCount >= 10000) return 5;
    if (stepCount >= 5000) return 3;
    return 0;
  }

  function visitPoints(visits, dateStr) {
    const onDate = visits.filter(v => v.date === dateStr && v.event === 'entry');
    return onDate.length > 0 ? 5 : 0;
  }

  function swimPoints(swimsByDate, dateStr) {
    const distance = swimsByDate[dateStr] || 0;
    return distance > 0 ? 5 : 0;
  }

  function dailyTotal(stepCount, gymVisits, swimsByDate, dateStr) {
    const raw = stepsToPoints(stepCount)
              + visitPoints(gymVisits, dateStr)
              + swimPoints(swimsByDate, dateStr);
    return Math.min(raw, 8);
  }

  function getWeekDays() {
    const today = new Date();
    today.setHours(0,0,0,0);
    const todayDow = (today.getDay() + 6) % 7;
    const monday = new Date(today);
    monday.setDate(today.getDate() - todayDow);
    const letters = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      days.push({
        key,
        date: d,
        name: letters[i],
        isFuture: d > today,
        isToday: d.getTime() === today.getTime()
      });
    }
    return days;
  }

  // ===== DATE SHIFT HELPER =====
  // Steps/swims logged on day N+1 actually represent activity from day N.
  // Subtract one day from the sheet date to get the actual activity date.
  function shiftDateBackOne(dateStr) {
    if (!dateStr) return null;
    const [y, m, d] = dateStr.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    date.setDate(date.getDate() - 1);
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  }

  async function loadData() {
    if (APPS_SCRIPT_URL === "PASTE_YOUR_URL_HERE") {
      showError(
        "Setup incomplete",
        "The Apps Script URL hasn't been pasted in yet. Open index.html in a text editor, find APPS_SCRIPT_URL near the top, and replace the placeholder.",
        null
      );
      return;
    }

    const refreshBtn = document.getElementById('refreshBtn');
    refreshBtn.classList.add('spinning');

    try {
      const response = await fetch(APPS_SCRIPT_URL);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      render(data);
      updateSync('healthy', 'Last sync just now');
    } catch (err) {
      showError(
        "Couldn't reach your data",
        "Either the URL is wrong, the deployment access isn't 'Anyone', or you're offline.",
        err.message
      );
      updateSync('error', 'Sync failed');
    } finally {
      setTimeout(() => refreshBtn.classList.remove('spinning'), 400);
    }
  }

  function showError(title, message, detail) {
    document.getElementById('content').innerHTML = `
      <div class="error-card">
        <strong>${title}</strong>
        ${message}
        ${detail ? `<code>${detail}</code>` : ''}
      </div>
    `;
  }

  function updateSync(state, text) {
    const dot = document.getElementById('syncDot');
    dot.className = 'sync-dot' + (state === 'healthy' ? '' : ' ' + state);
    document.getElementById('syncText').textContent = text;
  }

  function render(data) {
    const weekDays = getWeekDays();

    // SHIFT: steps logged today are yesterday's data, so subtract one day from each sheet date
    const stepsByDate = {};
    (data.steps || []).forEach(s => {
      const actualDate = shiftDateBackOne(s.date);
      if (actualDate) stepsByDate[actualDate] = s.count;
    });

    // SHIFT: same logic for swims
    const swimsByDate = {};
    (data.swims || []).forEach(s => {
      const actualDate = shiftDateBackOne(s.date);
      if (actualDate) swimsByDate[actualDate] = s.distance;
    });

    // NO SHIFT: gym visits are logged in real time (via geofence trigger)
    const gymVisits = data.gymVisits || [];

    const dayResults = weekDays.map(day => {
      if (day.isFuture) return { ...day, steps: null, points: null };
      const steps = stepsByDate[day.key] || 0;
      const points = dailyTotal(steps, gymVisits, swimsByDate, day.key);
      return { ...day, steps, points };
    });

    const weekTotal = dayResults.reduce((sum, d) => sum + (d.points || 0), 0);

    const weekStart = weekDays[0].key;
    const weekEnd = weekDays[6].key;
    const recentVisits = gymVisits.filter(v =>
      v.date >= weekStart && v.date <= weekEnd && v.event === 'entry'
    );

    // For swims display, we want to show by actual swim date (not sheet date)
    const recentSwims = Object.entries(swimsByDate)
      .filter(([date, distance]) => date >= weekStart && date <= weekEnd && distance > 0)
      .map(([date, distance]) => ({ date, distance }));

    document.getElementById('content').innerHTML = `
      <div class="week-card">
        <div class="week-card-title">This week</div>
        <div class="week-total">
          <span class="week-total-num">${weekTotal}</span>
          <span class="week-total-label">/ 50 points</span>
        </div>
        <div class="week-meta">${weekTotal >= 50 ? 'Tier 2 reached.' : weekTotal >= 40 ? 'Tier 1 reached.' : (50 - weekTotal) + ' more for Tier 2.'}</div>

        <div class="days-list">
          ${dayResults.map(d => renderDayRow(d)).join('')}
        </div>
      </div>

      <div class="activity-card">
        <div class="activity-card-title">This week's activity</div>
        ${recentVisits.length === 0 && recentSwims.length === 0 ? `
          <div class="activity-empty">No gym visits or swims yet this week</div>
        ` : ''}
        ${recentVisits.map(v => `
          <div class="activity-row">
            <div>
              <div class="activity-label">Gym visit</div>
              <div class="activity-meta">${formatActivityDate(v.date)}${v.time ? ' · ' + v.time : ''}</div>
            </div>
            <div class="activity-value">+5</div>
          </div>
        `).join('')}
        ${recentSwims.map(s => `
          <div class="activity-row">
            <div>
              <div class="activity-label">Swim</div>
              <div class="activity-meta">${formatActivityDate(s.date)} · ${Math.round(s.distance)}m</div>
            </div>
            <div class="activity-value">+5</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderDayRow(day) {
    if (day.isFuture) {
      return `
        <div class="day-row">
          <div class="day-name">${day.name} <span class="day-date">${day.date.getDate()}</span></div>
          <div class="day-right">
            <div class="day-steps">—</div>
            <div class="day-points zero">·</div>
          </div>
        </div>
      `;
    }
    return `
      <div class="day-row ${day.isToday ? 'today' : ''}">
        <div class="day-name">${day.name} <span class="day-date">${day.date.getDate()}</span></div>
        <div class="day-right">
          <div class="day-steps">${day.steps.toLocaleString()} steps</div>
          <div class="day-points ${day.points === 0 ? 'zero' : ''}">${day.points}</div>
        </div>
      </div>
    `;
  }

  function formatActivityDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    const today = new Date();
    today.setHours(0,0,0,0);
    const diff = Math.round((today - date) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return date.toLocaleDateString('en-GB', { weekday: 'long' });
  }

  loadData();
  setInterval(loadData, 5 * 60 * 1000);
</script>

</body>
</html>
