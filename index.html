<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reward Tracker">
<title>Reward Tracker</title>
<script>
  // 👇 PASTE YOUR GOOGLE APPS SCRIPT URL BELOW (the one ending in /exec)
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWFaZRctlYwlQUknF5WTDsDvJfEF64G-C9fCfu6m-NtnwhuHVYIRtUne6i6Vib3y-z/exec";
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #161616;
    --surface-2: #1f1f1f;
    --surface-3: #2a2a2a;
    --border: #2a2a2a;
    --text: #f5f5f5;
    --text-dim: #888;
    --text-faint: #555;
    --ring-track: #2a2a2a;
    --accent: #b87333;
    --accent-bright: #c8843d;
    --accent-soft: rgba(184, 115, 51, 0.14);
    --accent-tint: rgba(184, 115, 51, 0.06);
    --accent-border: rgba(184, 115, 51, 0.25);
    --ring-fill: #c8843d;
    --ring-fill-glow: rgba(200, 132, 61, 0.4);
    --lose: #e8746d;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  .pages {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  .page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    background: var(--bg);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  /* Three pages stacked horizontally: Home (0), Statement (right), Wallet (right) */
  .page.home { transform: translateX(0); z-index: 1; }
  .page.statement { transform: translateX(100%); z-index: 2; }
  .page.wallet { transform: translateX(100%); z-index: 2; }
  .pages.show-statement .page.home { transform: translateX(-20%); }
  .pages.show-statement .page.statement { transform: translateX(0); }
  .pages.show-wallet .page.home { transform: translateX(-20%); }
  .pages.show-wallet .page.wallet { transform: translateX(0); }

  /* HEADER */
  .top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0 20px;
  }
  .header-greeting { font-size: 13px; color: var(--text-dim); margin-bottom: 2px; }
  .header-day { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .refresh-btn, .back-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-family: inherit;
    flex-shrink: 0;
    position: relative;
    overflow: visible;
    transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.25s;
  }
  .refresh-btn:active, .back-btn:active { transform: scale(0.92); background: var(--surface-2); }
  .refresh-icon {
    position: relative;
    z-index: 2;
    transition: opacity 0.2s, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    line-height: 1;
  }
  .refresh-progress {
    position: absolute;
    inset: -1px;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .refresh-progress svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .refresh-progress .progress-fill {
    fill: none;
    stroke: var(--accent-bright);
    stroke-width: 2;
    stroke-linecap: round;
  }
  .refresh-btn.loading .refresh-icon { opacity: 0.4; }
  .refresh-btn.loading .refresh-progress {
    opacity: 1;
    animation: progress-spin 1.2s linear infinite;
  }
  .refresh-btn.loading .refresh-progress .progress-fill {
    stroke-dasharray: 32 100;
    stroke-dashoffset: 0;
  }
  @keyframes progress-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .refresh-btn.success {
    background: var(--accent-bright);
    border-color: var(--accent-bright);
    color: var(--bg);
    animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 20px var(--ring-fill-glow);
  }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    70% { transform: scale(0.96); }
    100% { transform: scale(1); }
  }
  .refresh-btn.error {
    background: rgba(232, 116, 109, 0.15);
    border-color: rgba(232, 116, 109, 0.4);
    color: #e8746d;
  }

  /* STATUS BADGE */
  .status-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    padding: 0 2px;
  }
  .status-badge-strip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-soft);
    padding: 6px 12px;
    border-radius: 100px;
    font-size: 10px;
    color: var(--accent-bright);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 700;
  }
  .status-badge-strip::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-bright);
  }
  .status-strip-meta { font-size: 11px; color: var(--text-dim); margin-left: auto; }

  /* SKELETON */
  .skeleton { pointer-events: none; }
  .skeleton-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 22px 18px;
    margin-bottom: 14px;
  }
  .skeleton-bar {
    background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2));
    background-size: 200% 100%;
    border-radius: 4px;
    animation: shimmer 1.8s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .skeleton-bar-sm { height: 10px; width: 80px; }
  .skeleton-bar-tiny { height: 8px; width: 60px; }
  .skeleton-ring-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 22px;
  }
  .skeleton-ring { width: 200px; height: 200px; position: relative; }
  .skeleton-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .skeleton-ring .track { fill: none; stroke: var(--surface-3); stroke-width: 13; opacity: 0.6; }
  .skeleton-ring .pulse {
    fill: none;
    stroke: var(--accent-bright);
    stroke-width: 13;
    stroke-linecap: round;
    stroke-dasharray: 60 580;
    animation: ring-rotate 2.4s linear infinite;
    opacity: 0.6;
    filter: drop-shadow(0 0 8px var(--ring-fill-glow));
  }
  @keyframes ring-rotate {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: -640; }
  }
  .skeleton-loading-text {
    text-align: center;
    color: var(--text-faint);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 24px;
    opacity: 0.7;
    animation: gentle-pulse 1.6s ease-in-out infinite;
  }
  @keyframes gentle-pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }
  .content-loaded { animation: content-rise 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
  @keyframes content-rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ERROR */
  .error-card {
    background: rgba(232, 116, 109, 0.1);
    border: 1px solid rgba(232, 116, 109, 0.3);
    border-radius: 16px;
    padding: 20px;
    color: #e8746d;
    font-size: 14px;
    line-height: 1.5;
  }
  .error-card strong { display: block; margin-bottom: 6px; font-weight: 700; }
  .error-card code {
    display: block;
    margin-top: 8px;
    padding: 8px;
    background: rgba(0,0,0,0.3);
    border-radius: 6px;
    font-size: 12px;
    color: var(--text);
    word-break: break-all;
  }

  /* WEEK CARD */
  .week-card {
    background: var(--surface);
    border-radius: 22px;
    padding: 22px 18px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
  }
  .week-card:active { background: var(--surface-2); transform: translateY(-1px); }
  .week-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .week-card-title {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
  }
  .week-card-link {
    font-size: 11px;
    color: var(--accent-bright);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .week-ring-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 22px;
  }
  .week-ring { width: 200px; height: 200px; position: relative; }
  .week-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .week-ring .ring-track { fill: none; stroke: var(--ring-track); stroke-width: 13; }
  .week-ring .ring-fill {
    fill: none;
    stroke: var(--ring-fill);
    stroke-width: 13;
    stroke-linecap: round;
    filter: drop-shadow(0 0 12px var(--ring-fill-glow));
    transition: stroke-dashoffset 1s cubic-bezier(0.34, 1.2, 0.64, 1);
  }
  .week-ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .week-ring-label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 4px;
  }
  .week-ring-number {
    font-size: 58px;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--text);
  }
  .week-ring-target { font-size: 16px; color: var(--text-faint); margin-top: 2px; font-weight: 500; }

  /* DAYS ROW */
  .days-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0;
    margin-bottom: 12px;
  }
  .day-mini {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }
  .day-mini-ring { width: 30px; height: 30px; position: relative; }
  .day-mini-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .day-mini-ring .ring-track { fill: none; stroke: var(--ring-track); stroke-width: 2.5; }
  .day-mini-ring .ring-fill {
    fill: none;
    stroke: var(--ring-fill);
    stroke-width: 2.5;
    stroke-linecap: round;
  }
  .day-mini-ring.future .ring-track { stroke: var(--ring-track); stroke-dasharray: 2 3; }
  .day-mini-num {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--ring-fill);
  }
  .day-mini-num.zero { color: var(--text-faint); font-weight: 500; }
  .day-mini-num.future { color: transparent; }
  .day-mini-letter {
    font-size: 9px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .day-mini.today .day-mini-letter { color: var(--accent-bright); font-weight: 700; }
  .day-mini.today .day-mini-ring {
    outline: 1.5px solid var(--text);
    outline-offset: 2px;
    border-radius: 50%;
  }
  .week-footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .week-footer strong { color: var(--text); font-weight: 600; }

  /* SECONDARY */
  .secondary-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .small-card {
    background: var(--surface);
    border-radius: 14px;
    padding: 12px;
    border: 1px solid var(--border);
  }
  .small-card-label {
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 5px;
  }
  .small-card-value {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
    color: var(--text);
  }
  .small-card-meta { font-size: 10px; color: var(--text-faint); }
  .cluster-dots { display: flex; gap: 5px; margin-top: 4px; }
  .cluster-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--surface-3);
    border: 1px solid var(--border);
  }
  .cluster-dot.filled { background: var(--accent-bright); border-color: var(--accent-bright); }

  /* ACTIVITY */
  .activity-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .activity-card-title {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .activity-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .activity-row:last-child { border-bottom: none; }
  .activity-label { color: var(--text); }
  .activity-meta { color: var(--text-dim); font-size: 11px; }
  .activity-value { color: var(--accent-bright); font-weight: 600; }

  /* BALANCE CARD */
  .balance-home-card {
    background: linear-gradient(135deg, var(--accent-soft), var(--accent-tint));
    border: 1px solid var(--accent-border);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
  }
  .balance-home-card:active { transform: scale(0.99); }
  .balance-home-card::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--ring-fill-glow), transparent 60%);
    pointer-events: none;
  }
  .balance-home-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
    flex-wrap: wrap;
  }
  .balance-home-label {
    font-size: 11px;
    color: var(--accent-bright);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 700;
    white-space: nowrap;
  }
  .balance-home-link {
    font-size: 11px;
    color: var(--accent-bright);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  .balance-home-value {
    display: flex;
    align-items: baseline;
    gap: 4px;
    position: relative;
    z-index: 1;
    flex-wrap: wrap;
    min-width: 0;
    max-width: 100%;
  }
  .balance-home-num {
    font-size: 42px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.03em;
    line-height: 1;
    overflow-wrap: anywhere;
  }
  .balance-home-suffix {
    font-size: 14px;
    color: var(--text-dim);
    font-weight: 500;
  }
  .balance-home-coupons {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--accent-border);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
    position: relative;
    z-index: 1;
  }
  .coupon-badge {
    background: var(--accent-bright);
    color: var(--bg);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 100px;
    line-height: 1.4;
  }

  /* SYNC */
  .sync-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 10px;
    color: var(--text-faint);
    margin: 14px 0 6px;
  }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #6dbe7b; }
  .sync-dot.error { background: #e8746d; }
  .v-tag {
    text-align: center;
    color: #333;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 16px;
  }

  /* ============================================
     WALLET PAGE
     ============================================ */
  .wallet-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 8px 0 18px;
  }
  .wallet-title-wrap { flex: 1; }
  .wallet-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .wallet-subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .balance-mini {
    background: linear-gradient(135deg, var(--accent-soft), var(--accent-tint));
    border: 1px solid var(--accent-border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .balance-mini-label {
    font-size: 10px;
    color: var(--accent-bright);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .balance-mini-val {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .balance-mini-val .unit {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 500;
    margin-left: 3px;
  }
  .balance-mini-meta {
    font-size: 10px;
    color: var(--text-dim);
    text-align: right;
    max-width: 130px;
    line-height: 1.3;
  }

  .seg-control {
    display: flex;
    background: var(--surface);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
  }
  .seg-tab {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 9px 0;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    border-radius: 8px;
    transition: all 0.2s;
  }
  .seg-tab.active {
    background: var(--accent-soft);
    color: var(--accent-bright);
  }
  .seg-badge {
    display: inline-block;
    background: var(--accent-bright);
    color: var(--bg);
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 100px;
    margin-left: 4px;
    font-weight: 700;
    vertical-align: 1px;
  }
  .seg-tab:not(.active) .seg-badge {
    background: var(--surface-3);
    color: var(--text-dim);
  }

  .section-title {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 700;
    margin: 16px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title:first-of-type { margin-top: 4px; }
  .section-title .right-meta {
    margin-left: auto;
    font-weight: 500;
    color: var(--text-faint);
    text-transform: none;
    letter-spacing: 0.02em;
    font-size: 10px;
  }

  /* REWARD CARDS */
  .reward-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .reward-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .reward-card.full-width {
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: center;
    min-height: auto;
    padding: 14px 16px;
  }
  .reward-card:not(.unaffordable):not(.locked):active {
    transform: scale(0.98);
    background: var(--surface-2);
  }
  .reward-card.affordable { border-color: var(--accent-border); }
  .reward-card.unaffordable { opacity: 0.45; cursor: not-allowed; }
  .reward-card.locked { opacity: 0.6; cursor: not-allowed; }
  .reward-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent-bright);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    margin-bottom: 8px;
    flex-shrink: 0;
  }

  <!-- STATEMENT -->

    <div class="wallet-header">

        <div class="wallet-title">Wallet</div>

<div class="toast" id="toast"></div>

<script>
  // ============================================
  // GLOBAL STATE
  // ============================================
  let cachedData = null;
  let currentMonth, currentYear;
  let activeWalletTab = 'coupons'; // 'coupons' or 'shop'
  let pendingPurchase = false; // for optimistic locking

  // ============================================
  // CONFIG
  // ============================================
  const RULES = {
    dailyCap: 8,
    softCap: 1500,
    perfectWeekThreshold: 50,
    perfectWeekBonus: 5,
    gymVisits4Bonus: 5,
    gymVisits5Bonus: 10,
    swims2Bonus: 5,
    everyDay12500Bonus: 10,
    clusterSize: 4,
    clusterBonus: 100,
    stampCardTarget: 10,
    statusMilestones: {
      silver: { weeks: 16, bonus: 200 },
      gold:   { weeks: 32, bonus: 300 },
      platinum: { weeks: 48, bonus: 500 }
    }
  };

  const REWARDS = [
    { id: 'small-sweet', name: 'Small sweet treat', meta: '200 kcal', price: 30, icon: '🍫', cat: 'treats' },
    { id: 'big-sweet', name: 'Big sweet treat', meta: '500 kcal', price: 70, icon: '🍰', cat: 'treats' },

    { id: 'flat-white', name: 'Flat white', meta: 'A proper one', price: 30, icon: '☕', cat: 'drinks' },
    { id: 'pint-1', name: '1 pint beer', meta: 'or 2 shandies / zeros', price: 30, icon: '🍺', cat: 'drinks' },
    { id: 'pint-2', name: '2 pints beer', meta: 'or 4 shandies / zeros', price: 50, icon: '🍻', cat: 'drinks' },
    { id: 'pint-4', name: '4 pints beer', meta: 'or 8 shandies / zeros', price: 90, icon: '🍻', cat: 'drinks' },

    { id: 'night-shorts', name: 'Guilt-free night on shorts', meta: 'No limits', price: 150, icon: '🥃', cat: 'nights', fullWidth: true },
    { id: 'night-beers', name: 'Guilt-free night on beers', meta: 'No limits', price: 200, icon: '🍻', cat: 'nights', fullWidth: true },

    { id: 'cheat-meal', name: 'Cheat meal', meta: 'One free meal', price: 150, icon: '🍔', cat: 'cheats', fullWidth: true },
    { id: 'cheat-day', name: 'Cheat day', meta: 'A full day of food and drinks, no rules', price: 500, icon: '🍕', cat: 'cheats', fullWidth: true },
    { id: 'cheat-weekend', name: 'Cheat weekend', meta: 'Friday to Sunday. Food and drinks.', price: 1000, icon: '🎉', cat: 'cheats', fullWidth: true },
  ];

  function rewardById(id) { return REWARDS.find(r => r.id === id); }

  // ============================================
  // GREETING
  // ============================================
  function setGreeting() {
    const hour = new Date().getHours();
    let greeting;
    if (hour < 5) greeting = "Late night, Rob";
    else if (hour < 12) greeting = "Good morning, Rob";
    else if (hour < 17) greeting = "Good afternoon, Rob";
    else if (hour < 21) greeting = "Good evening, Rob";
    else greeting = "Evening, Rob";
    document.getElementById('greeting').textContent = greeting;
    const today = new Date();
    document.getElementById('dayname').textContent = today.toLocaleDateString('en-GB', { weekday: 'long' });
  }
  setGreeting();

  // ============================================
  // SKELETON
  // ============================================
  function showSkeleton() {
    document.getElementById('content').innerHTML = `
      <div class="skeleton">
        <div class="skeleton-card">
          <div style="display: flex; justify-content: space-between; margin-bottom: 14px;">
            <div class="skeleton-bar skeleton-bar-sm"></div>
            <div class="skeleton-bar skeleton-bar-tiny"></div>
          </div>
          <div class="skeleton-ring-wrap">
            <div class="skeleton-ring">
              <svg viewBox="0 0 200 200">
                <circle class="track" cx="100" cy="100" r="93.5"></circle>
                <circle class="pulse" cx="100" cy="100" r="93.5"></circle>
              </svg>
            </div>
          </div>
        </div>
        <div class="skeleton-loading-text">Crunching the numbers</div>
      </div>
    `;
  }

  // ============================================
  // SCORING
  // ============================================
  function stepsToPoints(stepCount) {
    if (stepCount >= 12500) return 8;
    if (stepCount >= 10000) return 5;
    if (stepCount >= 5000) return 3;
    return 0;
  }
  function dailyTotal(stepCount, hasGymVisit, hasSwim) {
    const raw = stepsToPoints(stepCount)
              + (hasGymVisit ? 5 : 0)
              + (hasSwim ? 5 : 0);
    return Math.min(raw, RULES.dailyCap);
  }

  // ============================================
  // DATES
  // ============================================
  function keyFor(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function getWeekDays() {
    const today = new Date();
    today.setHours(0,0,0,0);
    const todayDow = (today.getDay() + 6) % 7;
    const monday = new Date(today);
    monday.setDate(today.getDate() - todayDow);
    const letters = ['M','T','W','T','F','S','S'];
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      days.push({
        key: keyFor(d),
        date: d,
        letter: letters[i],
        isFuture: d > today,
        isToday: d.getTime() === today.getTime()
      });
    }
    return days;
  }
  function shiftDateBackOne(dateStr) {
    if (!dateStr) return null;
    const [y, m, d] = dateStr.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    date.setDate(date.getDate() - 1);
    return keyFor(date);
  }
  function formatActivityDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    const today = new Date();
    today.setHours(0,0,0,0);
    const diff = Math.round((today - date) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return date.toLocaleDateString('en-GB', { weekday: 'long' });
  }
  function daysUntilExpiry(expiresAtIso) {
    if (!expiresAtIso) return null;
    try {
      const expires = new Date(expiresAtIso);
      if (isNaN(expires.getTime())) return null;
      const now = new Date();
      const diff = Math.ceil((expires - now) / 86400000);
      return diff;
    } catch { return null; }
  }

  // ============================================
  // INDEX DATA
  // ============================================
  function indexData(data) {
    const stepsByDate = {};
    (data.steps || []).forEach(s => {
      const actualDate = shiftDateBackOne(s.date);
      if (actualDate) stepsByDate[actualDate] = s.count;
    });
    const swimsByDate = {};
    (data.swims || []).forEach(s => {
      const actualDate = shiftDateBackOne(s.date);
      if (actualDate) swimsByDate[actualDate] = s.distance;
    });
    const gymVisits = data.gymVisits || [];
    const gymVisitsByDate = {};
    gymVisits.forEach(v => {
      if (v.event === 'entry') gymVisitsByDate[v.date] = true;
    });
    return { stepsByDate, swimsByDate, gymVisitsByDate, gymVisits, wallet: data.wallet || [] };
  }

  // ============================================
  // WEEK COMPUTATION
  // ============================================
  function computeWeek(weekStart, weekEnd, indexed) {
    let dailyTotal_ = 0;
    let gymVisits = 0;
    let swims = 0;
    let all12500Days = 0;
    let countableDays = 0;

    const current = new Date(weekStart);
    while (current <= weekEnd) {
      const key = keyFor(current);
      const steps = indexed.stepsByDate[key] || 0;
      const hasGym = !!indexed.gymVisitsByDate[key];
      const hasSwim = (indexed.swimsByDate[key] || 0) > 0;
      const dp = dailyTotal(steps, hasGym, hasSwim);
      dailyTotal_ += dp;
      if (hasGym) gymVisits++;
      if (hasSwim) swims++;
      if (steps >= 12500) all12500Days++;
      countableDays++;
      current.setDate(current.getDate() + 1);
    }

    const bonuses = [];
    let bonusTotal = 0;
    if (dailyTotal_ >= RULES.perfectWeekThreshold) {
      bonuses.push({ label: 'Perfect week', points: RULES.perfectWeekBonus });
      bonusTotal += RULES.perfectWeekBonus;
    }
    if (gymVisits >= 5) {
      bonuses.push({ label: '5 gym visits', points: RULES.gymVisits5Bonus });
      bonusTotal += RULES.gymVisits5Bonus;
    } else if (gymVisits >= 4) {
      bonuses.push({ label: '4 gym visits', points: RULES.gymVisits4Bonus });
      bonusTotal += RULES.gymVisits4Bonus;
    }
    if (swims >= 2) {
      bonuses.push({ label: '2+ swims', points: RULES.swims2Bonus });
      bonusTotal += RULES.swims2Bonus;
    }
    if (countableDays === 7 && all12500Days === 7) {
      bonuses.push({ label: 'Every day 12,500+', points: RULES.everyDay12500Bonus });
      bonusTotal += RULES.everyDay12500Bonus;
    }
    return {
      dailyTotal: dailyTotal_,
      total: dailyTotal_ + bonusTotal,
      bonuses,
      bonusTotal,
      gymVisits,
      swims,
      isPerfect: dailyTotal_ >= RULES.perfectWeekThreshold
    };
  }
  function getYearOfSunday(weekStart) {
    const sunday = new Date(weekStart);
    sunday.setDate(sunday.getDate() + 6);
    return sunday.getFullYear();
  }

  // ============================================
  // ECONOMY
  // ============================================
  function computeEconomy(indexed) {
    const today = new Date();
    today.setHours(0,0,0,0);
    const todayDow = (today.getDay() + 6) % 7;
    const thisMonday = new Date(today);
    thisMonday.setDate(today.getDate() - todayDow);

    const allDates = new Set([
      ...Object.keys(indexed.stepsByDate),
      ...Object.keys(indexed.swimsByDate),
      ...indexed.gymVisits.map(v => v.date)
    ]);

    let earned = 0;
    let completedWeeks = [];

    if (allDates.size > 0) {
      const sortedDates = [...allDates].sort();
      const earliestDate = new Date(sortedDates[0]);
      const earliestDow = (earliestDate.getDay() + 6) % 7;
      const firstMonday = new Date(earliestDate);
      firstMonday.setDate(earliestDate.getDate() - earliestDow);

      let cursor = new Date(firstMonday);
      while (cursor < thisMonday) {
        const weekEnd = new Date(cursor);
        weekEnd.setDate(cursor.getDate() + 6);
        const wk = computeWeek(cursor, weekEnd, indexed);
        completedWeeks.push({
          start: keyFor(cursor),
          end: keyFor(weekEnd),
          year: getYearOfSunday(cursor),
          ...wk
        });
        cursor.setDate(cursor.getDate() + 7);
      }
    }

    const thisWeekEnd = new Date(thisMonday);
    thisWeekEnd.setDate(thisMonday.getDate() + 6);
    const thisWeek = computeWeek(thisMonday, thisWeekEnd, indexed);

    const currentYear = today.getFullYear();
    const annualCount = completedWeeks.filter(w => w.year === currentYear && w.isPerfect).length;

    // Cluster + stamp
    let runningCluster = 0;
    let clusterBonusesEarned = 0;
    for (const w of completedWeeks) {
      if (w.isPerfect) {
        runningCluster++;
        if (runningCluster === RULES.clusterSize) {
          clusterBonusesEarned++;
          runningCluster = 0;
        }
      } else {
        runningCluster = 0;
      }
    }
    const clusterCount = runningCluster;
    const stampsEarned = annualCount % RULES.stampCardTarget;
    const stampClaimsEarned = Math.floor(annualCount / RULES.stampCardTarget);

    // Status
    let statusTier = 'Bronze';
    if (annualCount >= RULES.statusMilestones.platinum.weeks) statusTier = 'Platinum';
    else if (annualCount >= RULES.statusMilestones.gold.weeks) statusTier = 'Gold';
    else if (annualCount >= RULES.statusMilestones.silver.weeks) statusTier = 'Silver';

    let statusBonusesEarned = 0;
    if (annualCount >= RULES.statusMilestones.silver.weeks) statusBonusesEarned += RULES.statusMilestones.silver.bonus;
    if (annualCount >= RULES.statusMilestones.gold.weeks) statusBonusesEarned += RULES.statusMilestones.gold.bonus;
    if (annualCount >= RULES.statusMilestones.platinum.weeks) statusBonusesEarned += RULES.statusMilestones.platinum.bonus;

    let dailyLifetime = 0;
    let weeklyBonusLifetime = 0;
    for (const w of completedWeeks) {
      dailyLifetime += w.dailyTotal;
      weeklyBonusLifetime += w.bonusTotal;
    }
    dailyLifetime += thisWeek.dailyTotal;

    const clusterBonusPoints = clusterBonusesEarned * RULES.clusterBonus;

    earned = dailyLifetime + weeklyBonusLifetime + clusterBonusPoints + statusBonusesEarned;

    // Subtract spends from wallet (purchase rows have negative points already)
    let walletNet = 0;
    (indexed.wallet || []).forEach(w => {
      if (w.type === 'purchase') {
        walletNet += w.points; // already negative
      }
      // Round 3: gamble wins / losses, stamp claims (will affect balance)
    });

    const balance = earned + walletNet;

    return {
      thisWeek,
      completedWeeks,
      balance,
      clusterCount,
      annualCount,
      currentYear,
      stampsEarned,
      stampClaimsEarned,
      statusTier
    };
  }

  // ============================================
  // RINGS
  // ============================================
  function ringSvg(score, size, strokeWidth, max = 8) {
    const r = (size - strokeWidth) / 2;
    const cx = size / 2;
    const cy = size / 2;
    const circumference = 2 * Math.PI * r;
    const fillRatio = Math.min(score / max, 1);
    const dashOffset = circumference * (1 - fillRatio);
    return `
      <svg viewBox="0 0 ${size} ${size}">
        <circle class="ring-track" cx="${cx}" cy="${cy}" r="${r}"></circle>
        <circle class="ring-fill" cx="${cx}" cy="${cy}" r="${r}"
                stroke-dasharray="${circumference}"
                stroke-dashoffset="${dashOffset}"></circle>
      </svg>
    `;
  }
  function emptyRingSvg(size, strokeWidth) {
    const r = (size - strokeWidth) / 2;
    return `<svg viewBox="0 0 ${size} ${size}"><circle class="ring-track" cx="${size/2}" cy="${size/2}" r="${r}"></circle></svg>`;
  }

  // ============================================
  // LOAD
  // ============================================
  async function loadData(showSkelOnLoad = true) {
    if (APPS_SCRIPT_URL === "PASTE_YOUR_URL_HERE") {
      showError("Setup incomplete", "Apps Script URL not set.", null);
      return;
    }
    const btn = document.getElementById('refreshBtn');
    btn.classList.remove('success', 'error');
    btn.classList.add('loading');
    if (showSkelOnLoad && !cachedData) showSkeleton();
    const loadStart = Date.now();
    try {
      const response = await fetch(APPS_SCRIPT_URL);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      cachedData = await response.json();
      const elapsed = Date.now() - loadStart;
      const minTime = 700;
      if (elapsed < minTime) await new Promise(r => setTimeout(r, minTime - elapsed));
      renderAll();
      updateSync('healthy', 'Last sync just now');
      btn.classList.remove('loading');
      btn.classList.add('success');
      setTimeout(() => btn.classList.remove('success'), 1500);
    } catch (err) {
      showError("Couldn't reach your data", "Check URL and deployment access.", err.message);
      updateSync('error', 'Sync failed');
      btn.classList.remove('loading');
      btn.classList.add('error');
      setTimeout(() => btn.classList.remove('error'), 2000);
    }
  }

  function renderAll() {
    renderHome();
    renderStatement();
    renderWallet();
  }

  function showError(title, message, detail) {
    document.getElementById('content').innerHTML = `
      <div class="error-card">
        <strong>${title}</strong>
        ${message}
        ${detail ? `<code>${detail}</code>` : ''}
      </div>
    `;
  }
  function updateSync(state, text) {
    const dot = document.getElementById('syncDot');
    dot.className = 'sync-dot' + (state === 'healthy' ? '' : ' ' + state);
    document.getElementById('syncText').textContent = text;
  }

  // ============================================
  // RENDER HOME
  // ============================================
  function renderHome() {
    if (!cachedData) return;
    const indexed = indexData(cachedData);
    const econ = computeEconomy(indexed);

    document.getElementById('statusBadge').textContent = `${econ.statusTier} · ${econ.currentYear}`;
    const ms = RULES.statusMilestones;
    let metaText;
    if (econ.statusTier === 'Bronze') metaText = `${Math.max(0, ms.silver.weeks - econ.annualCount)} weeks to Silver`;
    else if (econ.statusTier === 'Silver') metaText = `${Math.max(0, ms.gold.weeks - econ.annualCount)} weeks to Gold`;
    else if (econ.statusTier === 'Gold') metaText = `${Math.max(0, ms.platinum.weeks - econ.annualCount)} weeks to Platinum`;
    else metaText = 'Platinum reached';
    document.getElementById('statusMeta').textContent = metaText;

    const weekDays = getWeekDays();
    const dayResults = weekDays.map(day => {
      if (day.isFuture) return { ...day, points: null };
      const steps = indexed.stepsByDate[day.key] || 0;
      const hasGym = !!indexed.gymVisitsByDate[day.key];
      const hasSwim = (indexed.swimsByDate[day.key] || 0) > 0;
      return { ...day, points: dailyTotal(steps, hasGym, hasSwim) };
    });
    let lastActivity = 'no activity yet';
    for (let i = dayResults.length - 1; i >= 0; i--) {
      const d = dayResults[i];
      if (d.points && d.points > 0) {
        if (d.isToday) lastActivity = 'today';
        else lastActivity = formatActivityDate(d.key).toLowerCase();
        break;
      }
    }

    const weekStart = weekDays[0].key;
    const weekEnd = weekDays[6].key;
    const recentVisits = indexed.gymVisits.filter(v => v.date >= weekStart && v.date <= weekEnd && v.event === 'entry');
    const recentSwims = Object.entries(indexed.swimsByDate)
      .filter(([date, distance]) => date >= weekStart && date <= weekEnd && distance > 0)
      .map(([date, distance]) => ({ date, distance }));

    const clusterDots = Array.from({ length: RULES.clusterSize }, (_, i) =>
      `<div class="cluster-dot ${i < econ.clusterCount ? 'filled' : ''}"></div>`
    ).join('');

    let toNextLabel = econ.statusTier === 'Bronze' ? 'To Silver'
      : econ.statusTier === 'Silver' ? 'To Gold'
      : econ.statusTier === 'Gold' ? 'To Platinum' : 'Status';
    let toNextValue = econ.statusTier === 'Platinum' ? 'Max'
      : econ.statusTier === 'Bronze' ? `${Math.max(0, ms.silver.weeks - econ.annualCount)} wks`
      : econ.statusTier === 'Silver' ? `${Math.max(0, ms.gold.weeks - econ.annualCount)} wks`
      : `${Math.max(0, ms.platinum.weeks - econ.annualCount)} wks`;
    let toNextMeta = econ.statusTier === 'Platinum' ? 'Max tier!'
      : `${econ.annualCount} / ${econ.statusTier === 'Bronze' ? ms.silver.weeks : econ.statusTier === 'Silver' ? ms.gold.weeks : ms.platinum.weeks} done`;

    // Count active (non-redeemed, non-expired) coupons
    const activeCoupons = indexed.wallet.filter(w => isActiveCoupon(w));
    const couponCount = activeCoupons.length;

    document.getElementById('content').innerHTML = `
      <div class="content-loaded">
        <div class="week-card" onclick="goStatement()">
          <div class="week-card-header">
            <div class="week-card-title">Points this week</div>
            <div class="week-card-link">View statement ›</div>
          </div>
          <div class="week-ring-wrap">
            <div class="week-ring">
              ${ringSvg(econ.thisWeek.dailyTotal, 200, 13, 50)}
              <div class="week-ring-center">
                <div class="week-ring-label">This week</div>
                <div class="week-ring-number">${econ.thisWeek.dailyTotal}</div>
                <div class="week-ring-target">/ 50</div>
              </div>
            </div>
          </div>
          <div class="days-row">
            ${dayResults.map(d => renderDayMini(d)).join('')}
          </div>
          <div class="week-footer">
            Last points earned <strong>${lastActivity}</strong>
          </div>
        </div>

        <div class="secondary-row">
          <div class="small-card">
            <div class="small-card-label">Cluster</div>
            <div class="small-card-value">${econ.clusterCount} / ${RULES.clusterSize}</div>
            <div class="cluster-dots">${clusterDots}</div>
          </div>
          <div class="small-card">
            <div class="small-card-label">${toNextLabel}</div>
            <div class="small-card-value">${toNextValue}</div>
            <div class="small-card-meta">${toNextMeta}</div>
          </div>
        </div>

        ${(recentVisits.length > 0 || recentSwims.length > 0) ? `
          <div class="activity-card">
            <div class="activity-card-title">This week's activity</div>
            ${recentVisits.map(v => `
              <div class="activity-row">
                <div>
                  <div class="activity-label">Gym visit</div>
                  <div class="activity-meta">${formatActivityDate(v.date)}${v.time ? ' · ' + v.time : ''}</div>
                </div>
                <div class="activity-value">+5</div>
              </div>
            `).join('')}
            ${recentSwims.map(s => `
              <div class="activity-row">
                <div>
                  <div class="activity-label">Swim</div>
                  <div class="activity-meta">${formatActivityDate(s.date)} · ${Math.round(s.distance)}m</div>
                </div>
                <div class="activity-value">+5</div>
              </div>
            `).join('')}
          </div>
        ` : ''}

        <div class="balance-home-card" onclick="goWallet()">
          <div class="balance-home-header">
            <div class="balance-home-label">Your balance</div>
            <div class="balance-home-link">${couponCount > 0 ? 'Wallet ›' : 'Spend ›'}</div>
          </div>
          <div class="balance-home-value">
            <span class="balance-home-num">${econ.balance.toLocaleString()}</span>
            <span class="balance-home-suffix">pts</span>
          </div>
          ${couponCount > 0 ? `
            <div class="balance-home-coupons">
              <span class="coupon-badge">${couponCount}</span>
              <span>active coupon${couponCount === 1 ? '' : 's'} in wallet</span>
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }
  function renderDayMini(d) {
    return `
      <div class="day-mini ${d.isToday ? 'today' : ''}">
        <div class="day-mini-ring ${d.isFuture ? 'future' : ''}">
          ${d.isFuture ? emptyRingSvg(30, 2.5) : ringSvg(d.points, 30, 2.5, 8)}

    if (w.status !== 'active') return false;
    const daysLeft = daysUntilExpiry(w.expiresAt);
    if (daysLeft !== null && daysLeft < 0) return false;
    return true;
  }

  function formatPurchasedDate(iso) {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      const today = new Date();
      today.setHours(0,0,0,0);
      const dDay = new Date(d);
      dDay.setHours(0,0,0,0);
      const diff = Math.round((today - dDay) / 86400000);
      if (diff === 0) return 'today';
      if (diff === 1) return 'yesterday';
      if (diff < 7) return diff + ' days ago';
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    } catch { return ''; }
  }

  async function confirmBuy(rewardId) {
    if (pendingPurchase) return;
    const r = rewardById(rewardId);
    if (!r) return;

    pendingPurchase = true;
    const buyBtn = document.getElementById('buyBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    if (buyBtn) { buyBtn.disabled = true; buyBtn.textContent = 'Buying…'; }
    if (cancelBtn) cancelBtn.disabled = true;

    // Build the purchase row optimistically
    const now = new Date();
    const expiresAt = new Date(now);
    expiresAt.setDate(expiresAt.getDate() + 7);
    const timestamp = now.toISOString();

    const optimisticRow = {
      rowId: timestamp,
      timestamp: timestamp,
      type: 'purchase',
      itemId: r.id,
      itemName: r.name,
      points: -r.price,
      meta: '',
      status: 'active',
      expiresAt: expiresAt.toISOString(),
      redeemedAt: ''
    };

    // Update local cache immediately so the UI reflects the purchase
    if (!cachedData.wallet) cachedData.wallet = [];
    cachedData.wallet.push(optimisticRow);
    renderAll();
    closeSheet();
    toast(`Bought ${r.name}`);

    // Send the write to Apps Script
    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          sheet: 'Wallet',
          action: 'purchase',
          itemId: r.id,
          itemName: r.name,
          points: r.price,
          expiresAt: expiresAt.toISOString(),
          meta: ''
        }),
        headers: { 'Content-Type': 'text/plain' } // text/plain to avoid CORS preflight
      });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const result = await response.json();
      if (!result.success) throw new Error('Write failed');

      // Update the optimistic row's rowId with the real server timestamp
      if (result.loggedAt) {
        const idx = cachedData.wallet.findIndex(w => w.rowId === timestamp);
        if (idx >= 0) {
          cachedData.wallet[idx].rowId = result.loggedAt;
          cachedData.wallet[idx].timestamp = result.loggedAt;
          renderAll();
        }
      }
    } catch (err) {
      // Roll back optimistic update
      const idx = cachedData.wallet.findIndex(w => w.rowId === timestamp);
      if (idx >= 0) cachedData.wallet.splice(idx, 1);
      renderAll();
      toast(`Purchase failed. Try again.`, true);
    } finally {
      pendingPurchase = false;
    }
  }

  // ============================================
  // REDEEM FLOW
  // ============================================
  async function redeemCoupon(rowId) {
    if (pendingPurchase) return;
    const coupon = cachedData.wallet.find(w => w.rowId === rowId);
    if (!coupon) return;

    // Optimistic update
    pendingPurchase = true;
    coupon.status = 'redeemed';
    coupon.redeemedAt = new Date().toISOString();
    renderAll();
    toast(`Redeemed ${coupon.itemName}. Enjoy.`);

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          sheet: 'Wallet',
          action: 'redeem',
          rowId: rowId
        }),
        headers: { 'Content-Type': 'text/plain' }
      });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const result = await response.json();
      if (!result.success) throw new Error('Redeem failed');
    } catch (err) {
      // Roll back
      coupon.status = 'active';
      coupon.redeemedAt = '';
      renderAll();
      toast(`Redeem failed. Try again.`, true);
    } finally {
      pendingPurchase = false;
    }
  }

  // ============================================
  // STATEMENT (unchanged)
  // ============================================
  function renderStatement() {
    if (!cachedData) return;
    const today = new Date();
    today.setHours(0,0,0,0);
    if (currentMonth === undefined) {
      currentMonth = today.getMonth();
      currentYear = today.getFullYear();
    }
    const indexed = indexData(cachedData);
    const econ = computeEconomy(indexed);

    const completedWeeks = econ.completedWeeks.map(w => w.total);
    const recent4 = completedWeeks.slice(-4);
    const earlier4 = completedWeeks.slice(-8, -4);
    const recentAvg = recent4.length ? recent4.reduce((s,v)=>s+v,0) / recent4.length : 0;
    const earlierAvg = earlier4.length ? earlier4.reduce((s,v)=>s+v,0) / earlier4.length : 0;
    const trend = recentAvg - earlierAvg;
    const typical = completedWeeks.length ? Math.round(completedWeeks.reduce((s,v)=>s+v,0) / completedWeeks.length) : 0;
    const best = completedWeeks.length ? Math.max(...completedWeeks) : 0;

    const ms = RULES.statusMilestones;
    const remaining = econ.statusTier === 'Bronze' ? Math.max(0, ms.silver.weeks - econ.annualCount)
      : econ.statusTier === 'Silver' ? Math.max(0, ms.gold.weeks - econ.annualCount)
      : econ.statusTier === 'Gold' ? Math.max(0, ms.platinum.weeks - econ.annualCount) : 0;
    const nextTier = econ.statusTier === 'Bronze' ? 'Silver' : econ.statusTier === 'Silver' ? 'Gold' : 'Platinum';
    const progressPct = econ.statusTier === 'Bronze' ? Math.min(100, (econ.annualCount/ms.silver.weeks)*100)
      : econ.statusTier === 'Silver' ? Math.min(100, (econ.annualCount/ms.gold.weeks)*100)
      : econ.statusTier === 'Gold' ? Math.min(100, (econ.annualCount/ms.platinum.weeks)*100) : 100;

    document.getElementById('statementContent').innerHTML = `
      <div class="status-card-full">
        <div class="status-badge-strip">${econ.statusTier} · ${econ.currentYear}</div>
        <div class="status-progress-text"><span class="big">${econ.statusTier === 'Platinum' ? '★' : remaining}</span> ${econ.statusTier === 'Platinum' ? 'top tier' : 'weeks to ' + nextTier}</div>
        <div class="status-meta-text">${econ.annualCount} weeks at 50+ points this year</div>
        <div class="status-bar-track"><div class="status-bar-fill" style="width: ${progressPct}%"></div></div>
        <div class="status-milestones">
          <div class="status-milestone ${econ.statusTier === 'Bronze' ? 'current' : ''}">Bronze<br><span style="opacity:0.5">0</span></div>
          <div class="status-milestone ${econ.statusTier === 'Silver' ? 'current' : ''}">Silver<br><span style="opacity:0.5">16</span></div>
          <div class="status-milestone ${econ.statusTier === 'Gold' ? 'current' : ''}">Gold<br><span style="opacity:0.5">32</span></div>
          <div class="status-milestone ${econ.statusTier === 'Platinum' ? 'current' : ''}">Platinum<br><span style="opacity:0.5">48</span></div>
        </div>
      </div>
      <div class="trends-row">
        <div class="trend-pill">
          <div class="trend-label">Trend</div>
          <div class="trend-value ${trend >= 0 ? 'up' : 'down'}">${trend >= 0 ? '↑' : '↓'} ${Math.abs(Math.round(trend))}</div>
          <div class="trend-meta">vs prior 4 wks</div>
        </div>
        <div class="trend-pill">
          <div class="trend-label">Typical</div>
          <div class="trend-value">${typical}</div>
          <div class="trend-meta">avg / week</div>
        </div>
        <div class="trend-pill">
          <div class="trend-label">Best</div>
          <div class="trend-value">${best}</div>
          <div class="trend-meta">single week</div>
        </div>
      </div>
      <div class="calendar-card">${renderCalendar(indexed)}</div>
    `;
  }
  function renderCalendar(indexed) {
    const today = new Date();
    today.setHours(0,0,0,0);
    const monthName = new Date(currentYear, currentMonth, 1).toLocaleDateString('en-GB', { month: 'long' });
    const firstDay = new Date(currentYear, currentMonth, 1);
    const lastDay = new Date(currentYear, currentMonth + 1, 0);
    const startDow = (firstDay.getDay() + 6) % 7;
    const gridStart = new Date(firstDay);
    gridStart.setDate(firstDay.getDate() - startDow);
    const days = [];
    for (let i = 0; i < 42; i++) {
      const d = new Date(gridStart);
      d.setDate(gridStart.getDate() + i);
      const key = keyFor(d);
      const steps = indexed.stepsByDate[key] || 0;
      const hasGym = !!indexed.gymVisitsByDate[key];
      const hasSwim = (indexed.swimsByDate[key] || 0) > 0;
      const dataExists = (key in indexed.stepsByDate) || hasGym || hasSwim;
      const score = dataExists ? dailyTotal(steps, hasGym, hasSwim) : null;
      days.push({
        date: d,
        score,
        isOtherMonth: d.getMonth() !== currentMonth,
        isFuture: d > today,
        isToday: d.getTime() === today.getTime()
      });
      if (i >= 27 && d.getMonth() !== currentMonth && d > lastDay) break;
    }
    while (days.length > 35 && days.slice(-7).every(d => d.isOtherMonth)) days.length -= 7;
    const isCurrentMonth = currentYear === today.getFullYear() && currentMonth === today.getMonth();
    return `
      <div class="month-nav">
        <button class="month-arrow" onclick="prevMonth()">‹</button>
        <div class="month-label">${monthName} <span class="year">${currentYear}</span></div>
        <button class="month-arrow" onclick="nextMonth()" ${isCurrentMonth ? 'disabled' : ''}>›</button>
      </div>
      <div class="cal-table">
        <div class="dow-cell">M</div><div class="dow-cell">T</div><div class="dow-cell">W</div>
        <div class="dow-cell">T</div><div class="dow-cell">F</div><div class="dow-cell">S</div>
        <div class="dow-cell">S</div>
        ${days.map(d => renderDayCell(d)).join('')}
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-ring">${ringSvg(3, 18, 2)}</div><span>3 pts</span></div>
        <div class="legend-item"><div class="legend-ring">${ringSvg(5, 18, 2)}</div><span>5 pts</span></div>
        <div class="legend-item"><div class="legend-ring">${ringSvg(8, 18, 2)}</div><span>8 max</span></div>
      </div>
    `;
  }
  function renderDayCell(day) {
    let cls = 'day-cell';
    if (day.isOtherMonth) cls += ' other-month';
    if (day.isFuture) cls += ' future';
    if (day.isToday) cls += ' today';
    if (day.score === 0) cls += ' zero';
    if (day.score === 8) cls += ' max';
    const onclick = (day.isOtherMonth || day.isFuture || day.score === null) ? '' : `onclick="openDay('${keyFor(day.date)}')"`;
    const dayNum = day.date.getDate();
    let ringHtml = '', displayText = '';
    if (day.score !== null && !day.isFuture) {
      ringHtml = ringSvg(day.score, 28, 2.5);
      displayText = day.score;
    } else {
      ringHtml = emptyRingSvg(28, 2.5);
    }
    return `
      <div class="${cls}" ${onclick}>
        <div class="day-num">${dayNum}</div>
        <div class="ring-wrap-cal">${ringHtml}<div class="ring-text-cal">${displayText}</div></div>
      </div>
    `;
  }
  function prevMonth() {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderStatement();
  }
  function nextMonth() {
    const today = new Date();
    if (currentYear === today.getFullYear() && currentMonth === today.getMonth()) return;
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderStatement();
  }
  function openDay(dateKey) {
    if (!cachedData) return;
    const indexed = indexData(cachedData);
    const [y, m, d] = dateKey.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    const stepCount = indexed.stepsByDate[dateKey] || 0;
    const stepPoints = stepsToPoints(stepCount);
    const visitsOnDay = indexed.gymVisits.filter(v => v.date === dateKey && v.event === 'entry');
    const visitOnDay = visitsOnDay.length > 0;
    const vPoints = visitOnDay ? 5 : 0;
    const swimDistance = indexed.swimsByDate[dateKey] || 0;
    const swimP = swimDistance > 0 ? 5 : 0;
    const rawTotal = stepPoints + vPoints + swimP;
    const cappedTotal = Math.min(rawTotal, 8);
    const isMax = cappedTotal === 8;
    document.getElementById('detail-sheet').innerHTML = `
      <div class="detail-handle"></div>
      <div class="detail-date">${date.toLocaleDateString('en-GB', { weekday: 'long' })}</div>
      <div class="detail-day">${date.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}</div>
      ${isMax ? '<div class="detail-max-badge">Max day</div>' : ''}
      <div class="detail-hero">
        <div class="detail-ring">
          ${ringSvg(cappedTotal, 80, 6)}
          <div class="detail-ring-text">${cappedTotal}</div>
        </div>
        <div class="detail-hero-text">
          <div class="label">Points scored</div>
          <div class="value">${cappedTotal} of 8 max</div>
        </div>
      </div>
      <div class="detail-rows">
        <div class="detail-row ${stepPoints === 0 ? 'no-points' : ''}">
          <div class="detail-row-left">
            <div class="detail-row-label">Steps</div>
            <div class="detail-row-meta">${stepCount.toLocaleString()} steps</div>
          </div>
          <div class="detail-row-points">+${stepPoints}</div>
        </div>
        <div class="detail-row ${vPoints === 0 ? 'no-points' : ''}">
          <div class="detail-row-left">
            <div class="detail-row-label">Gym visit</div>
            <div class="detail-row-meta">${visitOnDay ? 'Nuffield Bolton' + (visitsOnDay[0].time ? ' · ' + visitsOnDay[0].time : '') : 'No visit'}</div>
          </div>
          <div class="detail-row-points">+${vPoints}</div>
        </div>
        <div class="detail-row ${swimP === 0 ? 'no-points' : ''}">
          <div class="detail-row-left">
            <div class="detail-row-label">Swim</div>
            <div class="detail-row-meta">${swimDistance > 0 ? Math.round(swimDistance) + 'm' : 'No swim'}</div>
          </div>
          <div class="detail-row-points">+${swimP}</div>
        </div>
      </div>
      <div class="detail-totals">
        Raw total: <strong>${rawTotal}</strong> · Daily total: <strong>${cappedTotal}</strong>
        ${rawTotal > 8 ? '<br>Daily cap of 8 applied.' : ''}
      </div>
      <button class="detail-close" onclick="closeDay()">Close</button>
    `;
    document.getElementById('detail-sheet').classList.add('open');
    document.getElementById('overlay').classList.add('active');
  }
  function closeDay() {
    document.getElementById('detail-sheet').classList.remove('open');
    document.getElementById('overlay').classList.remove('active');
  }

  // ============================================
  // BOOT
  // ============================================
  showSkeleton();
  loadData(false);
  setInterval(() => loadData(false), 5 * 60 * 1000);
</script>

</body>
</html>
