name: Meal analysis server

on:
  push:
    paths:
      - "server/meal-analysis/**"
      - ".github/workflows/meal-analysis.yml"
  pull_request:
    paths:
      - "server/meal-analysis/**"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Cloudflare after the checks pass"
        type: boolean
        default: false

defaults:
  run:
    working-directory: server/meal-analysis

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/meal-analysis/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Deploys only when you run the workflow by hand with "deploy" ticked.
  # Needs these repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
  # ANTHROPIC_API_KEY and DEVICE_TOKEN.
  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/meal-analysis/package-lock.json
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/meal-analysis
          secrets: |
            ANTHROPIC_API_KEY
            DEVICE_TOKEN
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
