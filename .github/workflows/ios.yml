name: iOS build and tests

on:
  push:
    paths:
      - "FitnessVault/**"
      - "FitnessVaultTests/**"
      - "FitnessVaultWidget/**"
      - "Shared/**"
      - "FitnessVault.xcodeproj/**"
      - "Config/**"
      - ".github/workflows/ios.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      # Xcode 26 so code using iOS 26 frameworks (Foundation Models) is compiled; the app still targets iOS 17.
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Choose an iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS-26")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No iPhone simulator available" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      # Exercise demo videos must be public and embeddable; prints each one's title for review.
      - name: Check exercise videos
        continue-on-error: true
        run: python3 scripts/check_exercise_videos.py FitnessVault/Domain/Training/ExerciseVideos.swift

      # Unsigned simulator build: no Apple account or certificates needed in CI.
      - name: Build and run unit tests
        run: |
          # Build first, then test. The build runs with fewer parallel compiler jobs (the runner has little memory
          # and SwiftUI type-checking is memory-hungry), has its own time limit, and is retried once if it stalls.
          set +e
          DESTINATION="id=${{ steps.simulator.outputs.udid }}"
          SWIFT_FLAGS='$(inherited) -Xfrontend -solver-expression-time-threshold=60'
          FILTER="Test Suite|Test Case .* (passed|failed|started)|Executed|\*\* (BUILD|TEST)|error:|Testing started"
          built=1
          for attempt in 1 2; do
            echo "Build attempt $attempt"
            perl -e 'alarm shift; exec @ARGV' 720 xcodebuild build-for-testing \
              -project FitnessVault.xcodeproj -scheme FitnessVault -destination "$DESTINATION" \
              -jobs 3 CODE_SIGNING_ALLOWED=NO OTHER_SWIFT_FLAGS="$SWIFT_FLAGS" \
              2>&1 | tee -a xcodebuild.log | grep --line-buffered -E "$FILTER"
            built=${PIPESTATUS[0]}
            [ "$built" -eq 0 ] && break
            # 142 is the time limit; anything else is a real failure, so don't retry it.
            [ "$built" -ne 142 ] && break
            echo "Build stalled; retrying"
            pkill -9 -f swift-frontend || true
            pkill -9 -f SWBBuildService || true
          done
          [ "$built" -ne 0 ] && exit "$built"
          # TEST_RUNNER_ variables reach the test process: ScreenshotTests renders the Gym and Kitchen.
          TEST_RUNNER_SCREENSHOTS=1 perl -e 'alarm shift; exec @ARGV' 900 xcodebuild test-without-building \
            -project FitnessVault.xcodeproj -scheme FitnessVault -destination "$DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee -a xcodebuild.log \
            | grep --line-buffered -E "$FILTER" \
            | grep --line-buffered -v "CoreData: "
          exit ${PIPESTATUS[0]}

      - name: Show compile errors
        if: failure()
        run: grep -E "error:" xcodebuild.log | sort -u | head -100 || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            xcodebuild.log
          if-no-files-found: ignore

      # Design review: prints the screens rendered by ScreenshotTests as base64 lines, so they can be read from the log.
      - name: Print screenshots
        if: always()
        run: |
          shopt -s nullglob
          for file in screenshots/*.jpg; do
            name=$(basename "$file" .jpg)
            base64 -i "$file" | tr -d '\n' | fold -w 8000 | sed "s/^/SHOT ${name} /"
            echo
          done
