name: iOS build and tests

on:
  push:
    paths:
      - "FitnessVault/**"
      - "FitnessVaultTests/**"
      - "FitnessVaultWidget/**"
      - "Shared/**"
      - "FitnessVault.xcodeproj/**"
      - "Config/**"
      - ".github/workflows/ios.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Xcode 26 so code using iOS 26 frameworks (Foundation Models) is compiled; the app still targets iOS 17.
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Choose an iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS-26")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No iPhone simulator available" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      # Unsigned simulator build: no Apple account or certificates needed in CI.
      - name: Build and run unit tests
        run: |
          # Progress is streamed so a slow build or a stuck test is visible, and each test has a time limit.
          set +e
          xcodebuild test \
            -project FitnessVault.xcodeproj \
            -scheme FitnessVault \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log \
            | grep --line-buffered -E "Test Suite|Test Case .* (passed|failed|started)|Executed|\*\* (BUILD|TEST)|error:|SwiftCompile normal [a-z0-9_]+ .*Coach|Testing started"
          status=${PIPESTATUS[0]}
          exit $status

      - name: Show compile errors
        if: failure()
        run: grep -E "error:" xcodebuild.log | sort -u | head -100 || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            xcodebuild.log
          if-no-files-found: ignore
